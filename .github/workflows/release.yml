name: Attach PHP 8.3 packages to draft release

on:
  workflow_dispatch:
    inputs:
      php_run_id:
        description: 'Successful PHP build run ID'
        required: true
        default: '42250131047'
        type: string
      pecl_run_id:
        description: 'Successful PECL build run ID (with Redis msgpack fix)'
        required: true
        type: string
      release_tag:
        description: 'Existing draft release tag'
        required: true
        default: 'v8.3.36-focal.1'
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-php83-focal
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download selected build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PHP_RUN: ${{ inputs.php_run_id }}
          PECL_RUN: ${{ inputs.pecl_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/php artifacts/pecl
          gh run download "$PHP_RUN" --repo "$REPO" \
            --name php8.3-ubuntu20.04-amd64 --dir artifacts/php
          gh run download "$PECL_RUN" --repo "$REPO" \
            --name php8.3-pecl-ubuntu20.04-amd64 --dir artifacts/pecl

      - name: Validate and stage Debian packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          shopt -s nullglob globstar
          php_debs=(artifacts/php/**/*.deb)
          pecl_debs=(artifacts/pecl/**/*.deb)
          echo "PHP packages: ${#php_debs[@]}"
          echo "PECL packages: ${#pecl_debs[@]}"
          (( ${#php_debs[@]} >= 30 )) || { echo 'Missing PHP packages'; exit 1; }
          (( ${#pecl_debs[@]} == 6 )) || { echo 'Expected exactly six PECL packages'; exit 1; }

          for extension in apcu igbinary msgpack redis imagick memcached; do
            matches=(artifacts/pecl/**/php8.3-"$extension"_*.deb)
            (( ${#matches[@]} == 1 )) || { echo "Missing/duplicate: $extension"; exit 1; }
          done

          for file in "${php_debs[@]}" "${pecl_debs[@]}"; do
            name="${file##*/}"
            [[ ! -e "release-assets/$name" ]] || { echo "Duplicate package: $name"; exit 1; }
            cp -- "$file" "release-assets/$name"
          done
          (cd release-assets && sha256sum ./*.deb > SHA256SUMS)
          echo "Staged $(find release-assets -maxdepth 1 -name '*.deb' | wc -l) packages"

      - name: Upload assets to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          [[ "$draft" == 'true' ]] || { echo "Release $TAG not found or not a draft"; exit 1; }
          gh release upload "$TAG" release-assets/*.deb release-assets/SHA256SUMS --repo "$REPO"
          echo "Attached assets to draft release $TAG. Draft remains unpublished."
