name: Attach PHP core packages to draft release

on:
  workflow_dispatch:
    inputs:
      php_run_id:
        description: 'Successful PHP core build run ID'
        required: true
        type: string
      release_tag:
        description: 'Existing draft release tag (v8.x.xx-focal.1)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-php-core-focal
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate tag and source build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.php_run_id }}
          TAG: ${{ inputs.release_tag }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TAG" =~ ^v(8\.[0-9]+)\.[0-9]+-focal\.[0-9]+$ ]]; then
            PHP_MINOR="${BASH_REMATCH[1]}"
          else
            echo "Invalid core release tag: $TAG"; exit 1
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          read -r result source_branch < <(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '[.conclusion,.head_branch] | join(" ")')
          [[ "$result" == success && "$source_branch" == "$BRANCH" ]] || {
            echo "Build run must have succeeded on $BRANCH (got $result on $source_branch)"; exit 1;
          }
          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          [[ "$draft" == true ]] || { echo "Release $TAG must exist as a draft"; exit 1; }
          echo "PHP_MINOR=$PHP_MINOR" >> "$GITHUB_ENV"

      - name: Download PHP core artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.php_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/core
          gh run download "$RUN_ID" --repo "$REPO" \
            --name "php${PHP_MINOR}-ubuntu20.04-amd64" --dir artifacts/core

      - name: Validate and stage packages
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob globstar
          packages=(artifacts/core/**/*.deb)
          (( ${#packages[@]} >= 30 )) || { echo 'Too few core packages'; exit 1; }
          mkdir -p release-assets
          for package in cli fpm common ldap; do
            matches=(artifacts/core/**/php"${PHP_MINOR}"-"${package}"_*.deb)
            (( ${#matches[@]} == 1 )) || { echo "Missing/duplicate: $package"; exit 1; }
          done
          for file in "${packages[@]}"; do
            name="${file##*/}"
            if [[ "$name" == php8.* && "$name" != php"${PHP_MINOR}"-* ]]; then
              echo "Unexpected PHP version: $name"; exit 1
            fi
            [[ ! -e "release-assets/$name" ]] || { echo "Duplicate: $name"; exit 1; }
            cp -- "$file" "release-assets/$name"
          done
          if [[ "$PHP_MINOR" == 8.4 ]]; then
            common=(release-assets/php-common_*.deb)
            (( ${#common[@]} == 1 )) || { echo 'Missing shared php-common package'; exit 1; }
          fi
          (cd release-assets && sha256sum ./*.deb > SHA256SUMS)

      - name: Upload to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$TAG" release-assets/*.deb release-assets/SHA256SUMS --repo "$REPO"
          echo "Assets attached to draft $TAG; not published."
