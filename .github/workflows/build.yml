
name: Build PHP 8.3 Legacy

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REVISION: '1'
  SOURCE_URL: https://packages.sury.org/php/pool/main/p/php8.3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu20.04
            image: ubuntu:20.04

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download pinned source
        run: |
          mkdir sources out
          while read -r _ file; do
            curl -fsSL --retry 3 "$SOURCE_URL/$file" -o "sources/$file"
          done < sources.sha256
          (cd sources && sha256sum -c ../sources.sha256)

      - name: Build native amd64 packages in Docker
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo:ro" \
            -v "$PWD/sources:/sources:ro" \
            -v "$PWD/out:/out" \
            -e TARGET -e REVISION -e JOBS=4 \
            "$IMAGE" bash /repo/build.sh 2>&1 | tee out/build.log

          test -s out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php8.3-ubuntu20.04-amd64
          path: out/
          retention-days: 7
  
